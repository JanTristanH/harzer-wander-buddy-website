<!doctype html>
<html lang="{{ site.lang | default: 'de-DE' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ site.favicon | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/public-overview.css' | relative_url }}">
</head>
<body>
  <div class="shell-header">
    <a class="shell-brand" href="{{ '/' | relative_url }}" aria-label="Harzer Wanderbuddy Startseite">Wanderbuddy</a>
    <h1>Harzer Wandernadel: Karte &amp; Liste</h1>
    <details class="overview-info" open>
      <summary>Übersicht &amp; FAQ</summary>
      <div class="info-panel">
        <main class="overview-content">{{ content }}</main>
        <footer class="overview-content">
          <a href="{{ '/' | relative_url }}">Startseite</a> ·
          <a href="{{ '/impressum' | relative_url }}">Impressum</a> ·
          <a href="{{ '/privacy-policy' | relative_url }}">Datenschutz</a>
        </footer>
      </div>
    </details>
  </div>
  <iframe class="app-frame" data-app-base="{{ '/preview/overview/app/' | relative_url }}" title="Stempelstellen als interaktive Karte und Liste" allow="geolocation 'self'" src="about:blank"></iframe>
  <noscript><p class="overview-content">Die interaktive Karte benötigt JavaScript. Die vollständige Tabelle und alle Wanderinfos stehen oben ohne JavaScript bereit.</p></noscript>
  <script type="application/json" id="stamp-map-targets">{
    {% for stamp in site.data.guest_stamps.stamps %}"{{ stamp.number }}": {{ stamp.id | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}
  }</script>
  <script src="{{ '/assets/js/public-overview.js' | relative_url }}"></script>
</body>
</html>
