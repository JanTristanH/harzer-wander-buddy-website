name: Build real app and publish GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      as_of: ${{ steps.source.outputs.as_of }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest app source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-app-source.py

  pages-preview:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checkout the real app
        uses: actions/checkout@v5
        with:
          repository: JanTristanH/harzer-wander-buddy
          ref: ${{ needs.source.outputs.revision }}
          path: .app-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .app-source/app/package-lock.json
      - name: Install real app dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .app-source/app
      - name: Export public CAP data at this build's UTC date
        env:
          CATALOGUE_DATE: ${{ needs.source.outputs.as_of }}
        run: python3 .app-source/scripts/export-public-stamps.py --as-of "$CATALOGUE_DATE" --output _data/guest_stamps.json
      - name: Build Jekyll articles and SEO index
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Make Jekyll container output writable for assembly
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - name: Build the actual Expo app with static data
        run: node scripts/build-static-website.mjs "$RUNNER_TEMP/expo-website"
        working-directory: .app-source
      - name: Assemble the app and existing Jekyll website
        run: python3 scripts/assemble-static-app.py --app-dir "$RUNNER_TEMP/expo-website" --site _site
      - name: Check articles, actual app output and SEO isolation
        run: python3 scripts/check-guest-overview.py --site _site
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test the real app without a backend
        run: python3 scripts/test-guest-overview-browser.py --site _site --screenshots /tmp/overview-screenshots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: overview-screenshots
          path: /tmp/overview-screenshots
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages-preview
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the complete static site
        id: deployment
        uses: actions/deploy-pages@v4
